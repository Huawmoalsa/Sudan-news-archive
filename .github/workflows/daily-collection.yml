name: Daily Sudan News Collection

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect RSS and Atom feeds
        run: python scripts/collect.py

      - name: Commit archive changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if ! git diff --cached --quiet; then
            git commit -m "Daily Sudan news archive"
            git push
          else
            echo "No archive changes to commit."
          fi
